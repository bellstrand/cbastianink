name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Images are remembered between runs, so only new or changed photos are processed.
      - uses: actions/cache@v6
        with:
          path: .image-cache
          key: images-${{ hashFiles('assets/gallery/**', 'assets/portrait/**', 'assets/share/**', 'content/gallery.json', 'content/texts.json', 'content/settings.json') }}
          restore-keys: images-
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
